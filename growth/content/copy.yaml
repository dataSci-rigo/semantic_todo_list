# Bot copy. Rules: second person or none, present tense, numbers over adjectives,
# no "should", no praise for P1, no scolding for P5, no exclamation marks.
help: |
  <b>Growth</b> — the heart and head game. Tasks live in STM and the TaskBus; this layer works on starting, choosing, aiming, and resting on purpose.

  Daily arc: /morning · /aim · /end · /now (refocus) · /evening. Timers: /rest, /surf, /start5. Not starting: /avoid. Wins: /win, /win_old, /wins, /remind. Setup: /start, /why. Progress: /status, /observe, /survival. Data: /mydata. /skip passes a text question, /cancel abandons the open card.

help_short: |
  <b>Growth</b>: /morning /aim /end /now /evening · /rest /surf /start5 · /avoid · /win /remind · /status · /help growth

onboard_intro: |
  Setup: eleven short answers. Each one is a card; reply to it, or type. /skip passes, /why edits later.

onboard_outro: |
  That is the frame. Ten past wins seed the Success Bank: /win_old, any time, one per message.
  The excuse catalog starts with 14 common excuses; /excuses lists them.
  The arc runs daily: morning at {morning_time}, refocus around {windows}, evening at {evening_time}. Today's remaining touches are already scheduled; /status shows the times.

survival_suggest: "Capacity 0 two days running. /survival on collapses the day to morning, one challenge, one refocus, evening. Levels freeze."
survival_on: "Survival mode on. Morning, one challenge, one refocus, evening. Levels frozen."
survival_off: "Survival mode off. Full arc from tomorrow."

levelup: "{track_name} {track}{level} reached. {evidence}"
tier_unlock: "Block size {label} unlocked. Pick it in the morning card."
streak_milestone: "{n} days with at least one touch."
streak_goal: "30 days, one touch or more each day."

