  top_interest: "What activity makes you lose track of time?"
  signature_strengths: "Top 3 strengths, comma-separated."
  avoided_tasks: "What have you avoided for more than a week? Names only, one per line."
  rest_restores: "What restores you, and for how long? One per line: activity, minutes."
  rest_feels_like: "What feels like rest but leaves you worse? One per line."
  franklin_virtues: "Four virtues, comma-separated."
  roles: "Your roles, comma-separated."
